<!DOCTYPE html>
<html lang="en-us">
  <head>
    <meta charset="utf-8">
    <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
    <title>Unity Web Player | Son Çiftlik</title>
    <link rel="shortcut icon" href="TemplateData/favicon.ico">
    <link rel="stylesheet" href="TemplateData/style.css">
      <script src="https://telegram.org/js/telegram-web-app.js"></script>
      <script>(function(){var n=0;function s(m){if(n++>14)return;try{fetch('/api/clientlog',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({msg:String(m).slice(0,1500)})}).catch(function(){});}catch(e){}}
      window.dhcLog=s;[30,90,180,300].forEach(function(t){setTimeout(function(){var m=performance.memory;s('alive t='+t+'s'+(m?' jsheap='+Math.round(m.usedJSHeapSize/1048576)+'MB':'')+' visible='+!document.hidden);},t*1000);});s('start mem='+navigator.deviceMemory+'GB dpr='+window.devicePixelRatio+' '+window.innerWidth+'x'+window.innerHeight);
      window.addEventListener('error',function(e){s('error: '+e.message+' @'+(e.filename||'')+':'+e.lineno);});
      window.addEventListener('unhandledrejection',function(e){var r=e.reason;s('rejection: '+(r&&(r.stack||r.message)||r));});
      document.addEventListener('webglcontextlost',function(){s('webgl context lost');},true);
      window.addEventListener('pagehide',function(){try{navigator.sendBeacon('/api/clientlog',JSON.stringify({msg:'pagehide (closed by user or app) t='+Math.round(performance.now()/1000)+'s'}));}catch(e){}});
      var a=window.alert;window.alert=function(m){s('alert: '+m);return a.apply(window,arguments);};})();</script>
  </head>
  <body>
    <div id="unity-container" class="unity-desktop">
      <div id="unity-fullscreen-container">
        <canvas id="unity-canvas" width="960" height="600" tabindex="-1"></canvas>
        <div id="unity-loading-container">
          <div id="unity-loading-bar">
            <div id="unity-logo"></div>
            <div id="unity-progress-bar-empty">
              <div id="unity-progress-bar-full"></div>
            </div>
          </div>
        </div>
      </div>
      <div id="unity-warning"> </div>
      <div id="unity-footer">
        <div id="unity-logo-title-footer"></div>
        <div id="unity-fullscreen-button"></div>
        <div id="unity-build-title">Son Çiftlik</div>
      </div>
    </div>
    <script>
      let canvas = document.querySelector("#unity-canvas");
      let fullscreenContainer = document.querySelector("#unity-fullscreen-container");

      // Shows a temporary message banner/ribbon for a few seconds, or
      // a permanent error message on top of the canvas if type=='error'.
      // If type=='warning', a yellow highlight color is used.
      // Modify or remove this function to customize the visually presented
      // way that non-critical warnings and error messages are presented to the
      // user.
      function unityShowBanner(msg, type) {
        var warningBanner = document.querySelector("#unity-warning");
        function updateBannerVisibility() {
          warningBanner.style.display = warningBanner.children.length ? 'block' : 'none';
        }
        var div = document.createElement('div');
        div.innerHTML = msg;
        warningBanner.appendChild(div);
        if (type == 'error') div.style = 'background: red; padding: 10px;';
        else {
          if (type == 'warning') div.style = 'background: yellow; padding: 10px;';
          setTimeout(function() {
            warningBanner.removeChild(div);
            updateBannerVisibility();
          }, 5000);
        }
        updateBannerVisibility();
      }

      var buildUrl = "Build";
      var loaderUrl = buildUrl + "/WebGLPublic.loader.js";
      var config = {
        arguments: [],
        dataUrl: buildUrl + "/WebGLPublic.data.unityweb",
        frameworkUrl: buildUrl + "/WebGLPublic.framework.js.unityweb",
        codeUrl: buildUrl + "/WebGLPublic.wasm.unityweb",
        streamingAssetsUrl: "StreamingAssets",

        // If you have a custom web site structure, or want to place multiple Unity build instances on the same page,
        // you can pass fullscreenElementID: "my-unity-fullscreen-container-id", in this configuration field to
        // explicitly point to the element tree root that is displayed in fullscreen mode.
        fullscreenElementID: "unity-fullscreen-container",

        companyName: "DenizHanim",
        productName: "Son Çiftlik",
        productVersion: "2.2 (12.10.2026 06:16)",
        showBanner: unityShowBanner,
        // errorHandler: function(err, url, line) {
        //    alert("error " + err + " occurred at line " + line);
        //    // Return 'true' if you handled this error and don't want Unity
        //    // to process it further, 'false' otherwise.
        //    return true;
        // },
      };

      // By default, Unity keeps WebGL canvas render target size matched with
      // the DOM size of the canvas element (scaled by window.devicePixelRatio)
      // Set this to false if you want to decouple this synchronization from
      // happening inside the engine, and you would instead like to size up
      // the canvas DOM size and WebGL render target sizes yourself.
      // config.matchWebGLToCanvasSize = false;

      // If you would like all file writes inside Unity Application.persistentDataPath
      // directory to automatically persist so that the contents are remembered when
      // the user revisits the site the next time, uncomment the following line:
      config.autoSyncPersistentDataPath = true;
      // This autosyncing is currently not the default behavior to avoid regressing
      // existing user projects that might rely on the earlier manual
      // JS_FileSystem_Sync() behavior, but in future Unity version, this will be
      // expected to change.

      if (/iPhone|iPad|iPod|Android/i.test(navigator.userAgent)) {
        // Mobile device style: fill the whole browser client area with the game canvas:

        var meta = document.createElement('meta');
        meta.name = 'viewport';
        meta.content = 'width=device-width, initial-scale=1.0, user-scalable=no, shrink-to-fit=yes';
        document.getElementsByTagName('head')[0].appendChild(meta);
        document.querySelector("#unity-container").className = "unity-mobile";
        canvas.className = "unity-mobile";

        // To lower canvas resolution on mobile devices to gain some
        // performance, uncomment the following line:
        config.devicePixelRatio = Math.min(window.devicePixelRatio || 1, 1.5);


      } else {
        // Desktop style: Render the game canvas container in a window that can be maximized to fullscreen:
        fullscreenContainer.style.width = "960px";
        fullscreenContainer.style.height = "600px";
      }


      var script = document.createElement("script");
      script.src = loaderUrl;
      script.onload = () => {
        const loadingContainer = document.querySelector("#unity-loading-container");
        const progressBarFull = document.querySelector("#unity-progress-bar-full");

        createUnityInstance(canvas, config, (progress) => {
          if (progress < 1) {
            loadingContainer.style.display = "block";
            progressBarFull.style.width = 100 * progress + "%";
          } else {
            loadingContainer.style.display = "none";
          }
        }).then((unityInstance) => { if (window.dhcLog) window.dhcLog("engine ready t=" + Math.round(performance.now() / 1000) + "s");
                document.querySelector("#unity-fullscreen-button").onclick = () => {
                  unityInstance.SetFullscreen(1);
                };

              }).catch((message) => {
                alert(message);
              });
            };

      fetch('version.txt?t=' + Date.now(), { cache: 'no-store' }).then(function (r) { return r.ok ? r.text() : ''; }).catch(function () { return ''; }).then(function (v) {
        v = (v || '').trim().slice(0, 40);
        if (/^[0-9A-Za-z._-]+$/.test(v)) { var q = '?v=' + v; config.dataUrl += q; config.frameworkUrl += q; config.codeUrl += q; script.src = loaderUrl + q; config.cacheControl = function () { return 'no-store'; }; }
        document.body.appendChild(script);
      });

    </script>
    <script>(function(){var bar=document.querySelector('#unity-loading-bar');if(bar){var p=document.createElement('div');p.style.cssText='color:#f6e7c1;font:15px sans-serif;text-align:center;margin:14px 0 0 -60px;width:274px';p.textContent='FarmRush yükleniyor… İlk açılış 1 dakika kadar sürebilir.';bar.appendChild(p);}var w=window.Telegram&&window.Telegram.WebApp;if(!w||!w.initData)return;var phone=w.platform==='android'||w.platform==='ios';try{w.ready();w.expand();if(w.disableVerticalSwipes)w.disableVerticalSwipes();if(phone&&w.requestFullscreen&&w.isVersionAtLeast&&w.isVersionAtLeast('8.0')){document.body.style.background='#000';w.requestFullscreen();}}catch(e){}function fit(){var c=document.querySelector('#unity-container');if(!c||!c.classList.contains('unity-mobile'))return;var fs=!!w.isFullscreen,s=w.safeAreaInset||{},k=w.contentSafeAreaInset||{};var t=fs?(s.top||0)+(k.top||0):0,b=fs?(s.bottom||0)+(k.bottom||0):0,l=fs?(s.left||0):0,r=fs?(s.right||0):0;var h=fs?window.innerHeight:(w.viewportStableHeight||w.viewportHeight);if(!(h>100))return;window.dhcTopInset=t;window.dhcSafeTop=fs?(s.top||0):0;c.style.top='0px';c.style.left=l+'px';c.style.width=(window.innerWidth-l-r)+'px';c.style.height=(h-b)+'px';}['viewportChanged','fullscreenChanged','safeAreaChanged','contentSafeAreaChanged'].forEach(function(e){try{w.onEvent(e,fit);}catch(x){}});window.addEventListener('resize',fit);fit();setTimeout(fit,600);setTimeout(fit,2500);})();</script>
  </body>
</html>
